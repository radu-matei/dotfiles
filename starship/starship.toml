command_timeout = 300

[character]
success_symbol = '[ ](bold green)'
error_symbol = '[ ](bold red)'
[username]
style_user = 'white bold'
style_root = 'black bold'
format = '[$user]($style)'
disabled = false
show_always = true

[hostname]
ssh_only = false
ssh_symbol = " "
format = '@[$hostname](bold red) '
trim_at = '.local'
disabled = false

[gcloud]
disabled = true

[memory_usage]
symbol = "󰍛 "
disabled = false
threshold = -1
style = 'bold green'

[git_metrics]
disabled = false

[git_status]
disabled = false
ahead = '⇡{count}'
diverged = '⇕⇡{ahead_count}⇣{behind_count}'
behind = '⇣{count}'

[aws]
symbol = "  "
disabled = true

